<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            color: #0e0f0f;
        }

        body {
            background: #2A7B9B;
            background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%);
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50%;
            margin: 20px auto;
            /* border: 2px solid red */
        }

        .btn {
            display: block;
            margin: 20px auto;

            width: 120px;
            padding: 10px 15px;

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;

            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);

            color: #0f172a;
            font-family: "Poppins", sans-serif;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);

            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);

            background: rgba(255, 255, 255, 0.45);

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.2);
        }


        .container {
            width: 350px;
            min-height: 450px;
            margin: 20px auto;

            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);

            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-style: normal;
        }


        /* macOS top bar */
        .window-bar {
            height: 45px;

            display: flex;
            align-items: center;
            gap: 9px;

            padding-left: 16px;

            background: rgba(255, 255, 255, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }


        .control {
            width: 13px;
            height: 13px;
            border-radius: 50%;
        }


        .red {
            background: #ff5f57;
        }

        .yellow {
            background: #febc2e;
        }

        .green {
            background: #28c840;
        }


        /* user area */
        .profile-content {
            padding: 20px;
        }

    width: 320px;

            font-style: normal;
} */

        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.6);
            margin: auto;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: xx-large;
        }

        .info {
            box-sizing: border-box;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-wrap: wrap;
            padding-left: 10px;
        }

        p {
            word-wrap: break-word;
            max-width: 220px;
        }

        .infos {
            color: #0f172a;
            font-weight: 500;
        }

        .image {
            object-fit: cover;
            width: 100%;
            height: 100%;
            border: none;

        }

        .button {
            display: flex;

        }

        @media screen and (max-width: 400px) {
            .container {
                width: 90%;
                min-height: auto;
            }
        }
    </style>
</head>

<body>
    <h1> Random User Generator</h1>
    <div class="container">

        <div class="window-bar">
            <div class="control red"></div>
            <div class="control yellow"></div>
            <div class="control green"></div>
        </div>

        <div class="profile-content">

            <div class="photo">
                <span>?</span>
            </div>

            <div class="info">
                <p class="info-row">Name: <span id="name" class="infos"> ----</span></p>
                <p class="info-row">Age: <span id="age" class="infos"> ----</span></p>
                <p class="info-row">DOB: <span id="dob" class="infos"> ----</span></p>
                <p class="info-row">Gender: <span id="gender" class="infos"> ----</span></p>
                <p class="info-row">Email: <span id="email" class="infos"> ----</span></p>
                <p class="info-row">Phone: <span id="phone" class="infos"> ----</span></p>
                <p class="info-row">Address: <span id="address" class="infos"> ----</span></p>
            </div>

        </div>

    </div>
    <div class="button">
        <button class="btn">Click Me</button>
    </div>


    <script>
        let photo = document.querySelector(".photo");
        let name = document.getElementById("name");
        let age = document.getElementById("age");
        let dob = document.getElementById("dob");
        let gender = document.getElementById("gender");
        let email = document.getElementById("email");
        let phone = document.getElementById("phone");
        let address = document.getElementById("address");

        let btn = document.querySelector(".btn");

       
        let allUsers = null;
        btn.addEventListener("click", async () => {
            try {
                if (allUsers === null) {
                    allUsers = await getUser();
                    
                }
                let num = randomNum(allUsers);
                let displaysUser = display;
                displaysUser(allUsers, num);
                console.log(displaysUser);

            } catch (error) {
                console.log("Sorry the user cannot be generated at the moment")

            }
        })

        async function getUser() {
            let fetchUser = await fetch("https://dummyjson.com/users");
            if(!fetchUser.ok){
                throw new Error("Unable to fetch User");
                
            }
            let userss = await fetchUser.json();
            return userss;
        }

        function randomNum(userss) {
            let random = Math.floor(Math.random() * (userss.users.length))

            return random;
        }

        function display(userss, random) {
            const {
                firstName,
                lastName,
                image: userImage,
                age: userAge,
                gender: userGender,
                email: userGmail,
                phone: userPhone,
                address: {
                    state: userState,
                    address: mainAddress,
                    city,
                    state,
                    stateCode,
                    postalCode
                },
                birthDate
            } = userss.users[random];

            name.innerText = `${firstName} ${lastName}`;
            age.innerText = userAge;
            dob.innerText = birthDate;
            gender.innerText = userGender;
            email.innerText = userGmail;
            phone.innerText = userPhone;
            address.innerText = `${mainAddress} ${city} ${state} ${stateCode} ${postalCode}`;

            if (photo.firstElementChild) {
                photo.firstElementChild.remove();
            }


            let userPhoto = document.createElement("img");
            userPhoto.className = "image";
            userPhoto.src = userImage;

            photo.append(userPhoto);

            console.log(random);
            console.log(userss.users[random]);
        }
    </script>
</body>

</html>
